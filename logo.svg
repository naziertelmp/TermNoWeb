<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Dark background -->
  <rect width="200" height="200" fill="url(#bgGrad)" />
  
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0000" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3300" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
  </defs>

  <!-- Penguin face silhouette -->
  <ellipse cx="100" cy="100" rx="65" ry="75" fill="#111111" stroke="#330000" stroke-width="3" />
  
  <!-- White face patch (but dark gray/white to keep scary) -->
  <ellipse cx="100" cy="110" rx="45" ry="50" fill="#1a1a1a" />
  
  <!-- Glowing red eyes -->
  <ellipse cx="75" cy="80" rx="16" ry="22" fill="#000000" stroke="#ff0000" stroke-width="3" />
  <ellipse cx="125" cy="80" rx="16" ry="22" fill="#000000" stroke="#ff0000" stroke-width="3" />
  <circle cx="75" cy="80" r="9" fill="#ff0000" />
  <circle cx="125" cy="80" r="9" fill="#ff0000" />
  <circle cx="78" cy="77" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="128" cy="77" r="3" fill="#ffffff" opacity="0.9" />

  <!-- Sharp scary beak -->
  <polygon points="100,100 82,115 118,115" fill="url(#beakGrad)" />
  <polygon points="100,100 90,110 110,110" fill="#660000" />
  
  <!-- Cracks on face -->
  <path d="M60 60 L70 75 L65 90" stroke="#ff0000" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M140 50 L130 65 L135 80" stroke="#ff0000" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M90 40 L95 50 L92 60" stroke="#ff0000" stroke-width="1.5" fill="none" opacity="0.6" />

  <!-- Dark aura / flames -->
  <circle cx="100" cy="45" r="5" fill="#ff0000" opacity="0.4" />
  <circle cx="80" cy="32" r="3" fill="#ff0000" opacity="0.3" />
  <circle cx="120" cy="32" r="3" fill="#ff0000" opacity="0.3" />

  <!-- Project name (change as needed) -->
  <text x="100" y="188" font-family="monospace" font-size="20" font-weight="bold" fill="#ff0000" text-anchor="middle">WebTerm</text>
</svg>
